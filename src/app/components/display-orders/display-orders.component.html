<div class="orders-container">
  <h2>Existing Orders</h2>

  <div *ngIf="loading">Loading orders...</div>
  <div *ngIf="error" class="error">{{ error }}</div>

  <ul *ngIf="!loading && !error">
    <li *ngFor="let order of orders$ | async" class="order-item">
      <div class="order-header">
        <strong>Order #{{ order.id }}</strong>
        <span class="status">{{ order.status }}</span>
      </div>
      <div>Customer: {{ order.customer }}</div>
      <div>Items:
        <ul>
          <li *ngFor="let it of order.items">{{ it.qty }} x {{ it.name }}</li>
        </ul>
      </div>
      <div class="total">Total: ${{ order.total }}</div>
    </li>
  </ul>
  <div *ngIf="!(orders$ | async)?.length && !loading">No orders found.</div>
</div>
