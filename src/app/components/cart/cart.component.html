<div class="cart-container">
  <h2>Your Cart</h2>
  <div *ngIf="cartItems.length === 0" class="empty-cart">
    <p>Your cart is empty.</p>
    <button routerLink="/menu" class="back-btn">← Back to Menu</button>
  </div>
  <div *ngIf="cartItems.length > 0">
    <div class="cart-items">
      <div *ngFor="let ci of cartItems" class="cart-item-card">
        <div class="cart-item-header">
          <h3 class="item-name">{{ ci.item.name }}</h3>
          <span class="item-price">Rs {{ ci.item.price }}</span>
        </div>
        <div class="cart-item-footer">
          <div class="quantity-controls">
            <button (click)="decreaseQuantity(ci.item)" class="cart-btn">-</button>
            <span class="quantity-display">{{ ci.quantity }}</span>
            <button (click)="increaseQuantity(ci.item)" class="cart-btn">+</button>
          </div>
          <div class="item-subtotal">Rs {{ ci.item.price * ci.quantity }}</div>
        </div>
      </div>
    </div>
    <div class="cart-total">
      <strong>Total: Rs {{ total }}</strong>
    </div>
    <div class="cart-actions">
      <button routerLink="/menu" class="back-btn">← Back to Menu</button>
      <button (click)="sendCartToBackend()" class="submit-order-btn">Submit Order</button>
      <button (click)="clearCart()" class="clear-btn">Clear Cart</button>
    </div>
  </div>
</div>
