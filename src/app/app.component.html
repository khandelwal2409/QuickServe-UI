<div class="login-wrapper">
  <div class="login-container">
    <h1>QuickServe Admin</h1>
    <h2>Login</h2>
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="email">Email</label>
        <input id="email" type="email" formControlName="email" class="form-input" />
        <div *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched" class="error-message">Please enter a valid email</div>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input id="password" type="password" formControlName="password" class="form-input" />
        <div *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched" class="error-message">Password must be at least 6 characters</div>
      </div>
      <button type="submit" class="login-button" [disabled]="loginForm.invalid">Login</button>
      <button type="button" class="login-button" (click)="onReset()" style="margin-top:8px; background:#eee; color:#333">Reset</button>
    </form>

    <div *ngIf="loginError" class="error-container">Invalid credentials</div>
    <div *ngIf="loginSuccess" class="success-container">Login successful! (demo)</div>
    <p class="demo-hint">Demo credentials: <strong>admin@example.com</strong> / <strong>admin123</strong></p>
  </div>
</div>
